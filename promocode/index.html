<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROMOCODE | Whunx | l1beral</title>
    <meta name="description" content="Секретная страница. Введите промокод для доступа к эксклюзивным материалам.">
    <link rel="icon" type="image.png" href="/dslogo.png">
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <style>
        :root {
            /* Премиальная палитра проекта */
            --bg-body: #08090d;
            --accent-purple: #8b5cf6;
            --accent-purple-glow: rgba(139, 92, 246, 0.4);
            --accent-gold: #f4c745;
            --accent-gold-glow: rgba(244, 199, 69, 0.4);
            
            --glass-bg: rgba(15, 15, 20, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-main: #ffffff;
            --text-muted: #a3a8b5;
            --error: #ef4444;
            --success: #10b981;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { scrollbar-width: none; -ms-overflow-style: none; overflow-x: hidden; }
        html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

        body {
            font-family: 'Montserrat', sans-serif;
            width: 100%; min-height: 100vh; background-color: var(--bg-body);
            color: var(--text-main); display: flex; flex-direction: column; position: relative;
        }

        /* ── ФОН ── */
        .bg-blobs { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -2; overflow: hidden; background: var(--bg-body); pointer-events: none;}
        .blob { position: absolute; border-radius: 50%; filter: blur(150px); opacity: 0.25; animation: float 20s infinite alternate ease-in-out; }
        .blob-1 { width: 700px; height: 700px; background: var(--accent-purple); top: -20%; left: -10%; }
        .blob-2 { width: 600px; height: 600px; background: var(--accent-gold); bottom: -20%; right: -10%; animation-delay: -5s; opacity: 0.15; }
        .blob-3 { width: 500px; height: 500px; background: var(--accent-purple); top: 40%; left: 30%; opacity: 0.15; animation-delay: -10s; }
        @keyframes float { 0% { transform: translate(0, 0) scale(1); } 100% { transform: translate(40px, 40px) scale(1.1); } }

        body::before {
            content: ''; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -1; pointer-events: none;
            background: linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
            background-size: 50px 50px; mask-image: radial-gradient(ellipse at center, black 50%, transparent 100%);
        }

        .fade-in { animation: fadeIn 0.6s ease-out forwards; opacity: 0; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        /* ── TOAST УВЕДОМЛЕНИЯ ── */
        .toast-container { position: fixed; top: 25px; right: 25px; z-index: 100000; display: flex; flex-direction: column; gap: 12px; pointer-events: none; }
        .toast { background: rgba(15, 15, 20, 0.9); backdrop-filter: blur(20px); border: 1px solid var(--glass-border); border-left: 4px solid var(--accent-purple); color: #fff; padding: 16px 20px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); font-size: 0.9rem; font-weight: 600; display: flex; align-items: center; gap: 15px; animation: slideInRight 0.4s ease forwards; pointer-events: auto; }
        .toast.toast-error { border-left-color: var(--error); }
        .toast.toast-success { border-left-color: var(--success); }
        @keyframes slideInRight { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

        /* ── НАВИГАЦИЯ И БУРГЕР ── */
        .top-nav { display: flex; justify-content: center; align-items: center; gap: 5px; padding: 8px 10px; margin: 25px auto 0; position: relative; z-index: 20; max-width: fit-content; background: rgba(20, 20, 25, 0.5); border: 1px solid var(--glass-border); border-radius: 50px; backdrop-filter: blur(20px); box-shadow: 0 10px 30px rgba(0,0,0,0.4); }
        .nav-link { color: var(--text-muted); text-decoration: none; font-weight: 600; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; padding: 10px 20px; border-radius: 40px; transition: 0.3s; }
        .nav-link:hover { color: #fff; background: rgba(255, 255, 255, 0.05); }

        .burger-btn { position: fixed; top: 25px; left: 25px; z-index: 10001; background: var(--glass-bg); border: 1px solid var(--glass-border); width: 45px; height: 45px; border-radius: 12px; display: flex; justify-content: center; align-items: center; color: white; font-size: 1.1rem; cursor: pointer; transition: 0.3s; backdrop-filter: blur(10px); }
        .burger-btn:hover { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); }

        .sidebar { position: fixed; top: 0; left: -300px; width: 300px; height: 100vh; background: rgba(10, 10, 15, 0.9); backdrop-filter: blur(25px); border-right: 1px solid var(--glass-border); z-index: 10000; display: flex; flex-direction: column; padding: 80px 30px 30px; transition: 0.4s ease; box-shadow: 20px 0 50px rgba(0,0,0,0.8); }
        .sidebar.active { left: 0; }
        .sidebar-link { color: white; text-decoration: none; font-size: 1rem; font-weight: 600; padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; gap: 15px; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
        .sidebar-link i { color: var(--accent-purple); font-size: 1.3rem; transition: 0.3s; width: 25px; text-align: center; }
        .sidebar-link:hover, .sidebar-link.active { color: var(--accent-gold); padding-left: 10px; border-bottom-color: rgba(255,255,255,0.1); }
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); z-index: 9999; display: none; opacity: 0; transition: 0.3s; }
        .sidebar-overlay.active { display: block; opacity: 1; }

        /* ── ТОП-КОНТРОЛЫ ── */
        .top-controls { position: fixed; top: 25px; right: 25px; z-index: 10002; display: flex; align-items: center; gap: 12px; }
        .valuta-icon { width: 1.1em; height: 1.1em; vertical-align: middle; margin: -2px 4px 0 4px; filter: drop-shadow(0 0 5px rgba(244, 199, 69, 0.5)); }
        
        .global-balance { background: rgba(20, 20, 25, 0.8); border: 1px solid var(--glass-border); padding: 8px 16px; border-radius: 50px; display: none; align-items: center; gap: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.3); backdrop-filter: blur(10px); }
        .global-balance.active { display: flex; animation: fadeIn 0.5s ease forwards; }
        .global-balance .val { font-size: 1rem; font-weight: 800; color: #fff; }

        .online-counter { background: var(--glass-bg); border: 1px solid var(--glass-border); padding: 8px 16px; border-radius: 50px; display: flex; align-items: center; gap: 10px; backdrop-filter: blur(10px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); transition: 0.3s; cursor: default; white-space: nowrap; }
        .pulse-dot { width: 10px; height: 10px; background-color: var(--success); border-radius: 50%; box-shadow: 0 0 10px var(--success); animation: pulseGreen 2s infinite; }
        @keyframes pulseGreen { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        .online-num { color: var(--text-main); font-weight: 800; font-size: 0.85rem; }

        .profile-btn { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--glass-border); overflow: hidden; display: flex; justify-content: center; align-items: center; background: var(--bg-body); transition: 0.3s; text-decoration: none; cursor: pointer; }
        .profile-btn img { width: 100%; height: 100%; object-fit: cover; }
        .profile-btn:hover { border-color: var(--accent-purple); box-shadow: 0 0 15px var(--accent-purple-glow); transform: scale(1.05); }

        /* ── ЧАТ ТЕХПОДДЕРЖКИ ── */
        #chat-window { display: none; position: fixed; bottom: 30px; right: 30px; width: 360px; height: 500px; flex-direction: column; overflow: hidden; background: rgba(15, 15, 20, 0.9); border: 1px solid var(--glass-border); border-radius: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.6); backdrop-filter: blur(25px); z-index: 9999; }
        .chat-header { background: rgba(0,0,0,0.4); border-bottom: 1px solid var(--glass-border); color: #fff; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 2; cursor: grab; }
        .chat-header:active { cursor: grabbing; }
        .chat-header-title { font-weight: 800; font-size: 1rem; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-purple); }
        #chat-close { cursor: pointer; font-size: 1.3rem; transition: 0.3s; color: rgba(255,255,255,0.5); line-height: 1; padding: 5px; }
        #chat-close:hover { color: var(--error); }
        #chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; font-size: 0.9rem; scroll-behavior: smooth; }
        #chat-messages::-webkit-scrollbar { width: 4px; } #chat-messages::-webkit-scrollbar-thumb { background: var(--glass-border); border-radius: 10px; }
        .chat-system-msg { color: var(--text-muted); text-align: center; font-size: 0.75rem; font-weight: 600; padding: 8px; border-radius: 8px; background: rgba(255,255,255,0.02); text-transform: uppercase; letter-spacing: 1px; }
        .chat-system-ban { color: var(--error); text-align: center; font-size: 0.8rem; font-weight: 700; margin-bottom: 10px; padding: 10px; border: 1px solid var(--error); border-radius: 8px; background: rgba(239,68,68,0.1); display: none; }
        .chat-msg-wrapper { display: flex; flex-direction: column; animation: fadeIn 0.3s ease forwards; }
        .chat-msg-name { font-size: 0.7rem; font-weight: 700; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .chat-msg-bubble { padding: 12px 16px; border-radius: 14px; color: #fff; max-width: 85%; word-wrap: break-word; line-height: 1.4; font-weight: 500; }
        .msg-user { align-items: flex-end; } .msg-user .chat-msg-name { color: var(--accent-gold); } .msg-user .chat-msg-bubble { background: var(--accent-purple); border-bottom-right-radius: 2px; }
        .msg-bot { align-items: flex-start; } .msg-bot .chat-msg-name { color: var(--accent-purple); } .msg-bot .chat-msg-bubble { background: rgba(255,255,255,0.05); border: 1px solid var(--glass-border); border-bottom-left-radius: 2px; }
        .chat-input-area { padding: 15px; display: flex; gap: 10px; border-top: 1px solid var(--glass-border); background: rgba(0,0,0,0.3); }
        #chat-input { flex: 1; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); color: #fff; padding: 12px 15px; border-radius: 12px; outline: none; transition: 0.3s; font-family: 'Montserrat', sans-serif;}
        #chat-input:focus { border-color: var(--accent-purple); }
        #chat-send { background: var(--accent-purple); border: none; color: #fff; width: 45px; height: 45px; border-radius: 12px; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; font-size: 1.1rem; }
        #chat-send:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.1); box-shadow: 0 5px 15px var(--accent-purple-glow); }

        /* ── МОДАЛКА ВХОДА GOOGLE ── */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); z-index: 99999; justify-content: center; align-items: center; flex-direction: column; }
        .install-box { background: rgba(10, 10, 15, 0.95); border: 1px solid var(--accent-purple); border-radius: 28px; padding: 40px; max-width: 450px; width: 90%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 0 20px rgba(139, 92, 246, 0.1); position: relative; display: flex; flex-direction: column; align-items: center;}
        .install-box i.fa-user-astronaut { font-size: 3.5rem; color: var(--accent-purple); margin-bottom: 20px; filter: drop-shadow(0 0 15px var(--accent-purple-glow)); }
        .install-box h3 { font-size: 1.5rem; font-weight: 900; margin-bottom: 10px; color: #fff; text-transform: uppercase; letter-spacing: 1px; }
        .install-box p { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 25px; line-height: 1.5; }
        .install-close { position: absolute; top: 20px; right: 25px; color: var(--text-muted); font-size: 1.8rem; cursor: pointer; transition: 0.3s; }
        .install-close:hover { color: var(--error); transform: rotate(90deg); }
        .google-login-btn { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; max-width: 320px; padding: 16px; border-radius: 14px; background: rgba(255, 255, 255, 0.03); border: 1px solid var(--glass-border); color: #fff; font-weight: 800; font-size: 1.05rem; cursor: pointer; transition: 0.3s; text-transform: uppercase; letter-spacing: 1px; position: relative; }
        .google-login-btn:hover { background: rgba(255, 255, 255, 0.08); border-color: rgba(255, 255, 255, 0.2); box-shadow: 0 5px 20px rgba(255, 255, 255, 0.1); transform: translateY(-2px); }

        /* ── КОНТЕНТ ПРОМОКОДОВ ── */
        header { text-align: center; padding: 10vh 20px 2vh; position: relative; z-index: 10; }
        header h1 { font-size: clamp(2.5rem, 6vw, 4rem); font-weight: 900; text-transform: uppercase; letter-spacing: 8px; background: linear-gradient(90deg, #fff, var(--accent-purple), var(--accent-gold), #fff); background-size: 300% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 0 15px var(--accent-purple-glow)); animation: gradient-shift 6s linear infinite; margin-bottom: 10px; }
        @keyframes gradient-shift { 0% { background-position: 0% center; } 100% { background-position: 300% center; } }

        main { flex: 1; width: 100%; max-width: 900px; margin: 0 auto; padding: 0 20px 40px; z-index: 10; display: flex; flex-direction: column; align-items: center; position: relative; }

        .promo-wrapper { position: relative; width: 100%; max-width: 450px; display: flex; flex-direction: column; align-items: center; margin-top: 3vh; transition: all 0.5s ease-out; z-index: 10; }
        .promo-wrapper.hidden { opacity: 0; transform: scale(0.8); pointer-events: none; }
        
        .promo-box {
            display: flex; width: 100%; height: 70px; background: rgba(15, 15, 20, 0.6); border: 2px solid var(--accent-purple); border-radius: 20px; overflow: hidden;
            box-shadow: 0 0 30px var(--accent-purple-glow), inset 0 0 15px rgba(139, 92, 246, 0.1);
            backdrop-filter: blur(15px); transition: all 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            position: relative; z-index: 2;
        }
        .promo-box.collapsing { width: 70px; border-radius: 50%; background: var(--accent-purple); border-color: #fff; box-shadow: 0 0 50px var(--accent-purple); }
        .promo-box.collapsing input, .promo-box.collapsing button { opacity: 0; pointer-events: none; }
        
        .promo-box input { flex: 1; background: transparent; border: none; outline: none; padding: 0 25px; color: #fff; font-size: 1.2rem; font-weight: 700; text-align: center; font-family: 'Montserrat', sans-serif; letter-spacing: 2px; transition: opacity 0.3s; }
        .promo-box input::placeholder { color: var(--text-muted); font-weight: 500; letter-spacing: 1px; }
        .promo-box button { width: 70px; background: rgba(139, 92, 246, 0.1); border: none; border-left: 1px solid var(--glass-border); color: var(--accent-purple); font-size: 1.5rem; cursor: pointer; transition: 0.3s; display: flex; justify-content: center; align-items: center; }
        .promo-box button:hover { background: var(--accent-purple); color: #fff; box-shadow: -5px 0 20px var(--accent-purple-glow); }
        
        .error-msg { margin-top: 15px; color: var(--error); font-size: 0.95rem; font-weight: 600; opacity: 0; transform: translateY(-10px); transition: all 0.3s; text-align: center; }
        .error-msg.visible { opacity: 1; transform: translateY(0); }
        
        .splash-ring { position: absolute; top: 35px; left: 50%; width: 70px; height: 70px; background: var(--accent-purple); border-radius: 50%; transform: translate(-50%, -50%) scale(0); opacity: 0; pointer-events: none; z-index: 3; }
        .splash-ring.animate { animation: splashEffect 0.7s ease-out forwards; }
        @keyframes splashEffect { 0% { transform: translate(-50%, -50%) scale(1); opacity: 1; } 100% { transform: translate(-50%, -50%) scale(8); opacity: 0; } }

        /* Открытый сниппет */
        .snippet-wrapper { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 30px; margin-top: 20px; transition: transform 0.8s cubic-bezier(0.34, 1.56, 0.64, 1); position: relative; z-index: 5; }
        .snippet-wrapper.unlocked { transform: translateY(-120px); }

        .hero-release {
            background: rgba(15, 15, 20, 0.8);
            backdrop-filter: blur(25px); border: 2px solid var(--glass-border); border-radius: 30px; padding: 40px; display: flex; gap: 40px; align-items: center; width: 100%; max-width: 850px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(139, 92, 246, 0.05); position: relative; overflow: hidden;
            transition: all 0.6s ease-out; 
        }
        .unlocked .hero-release { border-color: var(--accent-purple); box-shadow: 0 0 50px rgba(139, 92, 246, 0.15), inset 0 0 20px rgba(139, 92, 246, 0.1); }
        
        .hero-release::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle at center, rgba(139,92,246,0.1) 0%, transparent 60%); animation: rotateBg 15s linear infinite; pointer-events: none; z-index: 0; }
        @keyframes rotateBg { 100% { transform: rotate(360deg); } }
        
        .hero-cover-wrap { position: relative; flex-shrink: 0; width: 300px; aspect-ratio: 1/1; z-index: 1; border-radius: 20px; overflow: hidden; box-shadow: 0 15px 40px rgba(0,0,0,0.8); border: 1px solid var(--glass-border); animation: float-cover 6s ease-in-out infinite; }
        @keyframes float-cover { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-10px) rotate(2deg); } 100% { transform: translateY(0px) rotate(0deg); } }
        
        .cover-placeholder { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; font-size: 6rem; color: var(--text-muted); transition: opacity 0.6s ease; z-index: 2; }
        .unlocked .cover-placeholder { opacity: 0; pointer-events: none; }
        #realCover { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: transform 0.5s, opacity 0.6s ease; z-index: 1; }
        .unlocked #realCover { opacity: 1; }
        .hero-cover-wrap:hover #realCover { transform: scale(1.05); }
        
        .hero-info { flex: 1; z-index: 1; display: flex; flex-direction: column; gap: 20px; width: 100%; }
        .hero-badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 18px; border-radius: 50px; font-size: 0.85rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; align-self: flex-start; transition: all 0.5s; }
        .locked-badge { color: var(--text-muted); border: 1px solid var(--text-muted); background: rgba(255, 255, 255, 0.05); }
        .unlocked-badge { color: var(--accent-gold); border: 1px solid var(--accent-gold); background: rgba(244, 199, 69, 0.15); box-shadow: 0 0 15px rgba(244, 199, 69, 0.3); }
        
        .hero-info h2 { font-size: 3rem; font-weight: 900; line-height: 1.1; color: #fff; text-shadow: 0 0 20px rgba(0,0,0,0.8); transition: color 0.5s; }
        .unlocked .hero-info h2 { text-shadow: 0 0 20px rgba(139, 92, 246, 0.4); }
        
        .audio-player-container { opacity: 0; max-height: 0; overflow: hidden; transition: all 0.6s ease; width: 100%; pointer-events: none; }
        .unlocked .audio-player-container { opacity: 1; max-height: 100px; pointer-events: all; }
        .audio-player { background: rgba(0,0,0,0.6); border-radius: 16px; padding: 15px 20px; display: flex; align-items: center; gap: 15px; border: 1px solid var(--glass-border); box-shadow: inset 0 0 20px rgba(0,0,0,0.8); width: 100%; }
        
        .play-pause-btn { background: var(--accent-purple); color: #fff; border: none; width: 45px; height: 45px; border-radius: 50%; font-size: 1.2rem; cursor: pointer; display: flex; justify-content: center; align-items: center; transition: 0.3s; box-shadow: 0 0 15px var(--accent-purple-glow); flex-shrink: 0; }
        .play-pause-btn:hover { transform: scale(1.1); filter: brightness(1.15); }
        
        .progress-container { flex: 1; height: 24px; display: flex; align-items: center; cursor: pointer; position: relative; touch-action: none; min-width: 50px; }
        .progress-container::before { content: ''; position: absolute; left: 0; width: 100%; height: 6px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
        .progress-bar { height: 6px; width: 0%; background: var(--accent-gold); border-radius: 10px; position: relative; pointer-events: none; z-index: 2; box-shadow: 0 0 10px var(--accent-gold); }
        .progress-bar::after { content: ''; position: absolute; right: -7px; top: -5px; width: 16px; height: 16px; background: #fff; border-radius: 50%; box-shadow: 0 0 12px var(--accent-gold); }
        .time-display { font-size: 0.85rem; color: var(--text-muted); font-variant-numeric: tabular-nums; font-weight: 700; min-width: 90px; text-align: right; white-space: nowrap; flex-shrink: 0; }
        
        #backBtn { opacity: 0; transform: translateY(-20px); transition: all 0.6s ease; pointer-events: none; background: transparent; border: 2px solid var(--text-muted); color: var(--text-muted); padding: 12px 30px; border-radius: 50px; font-size: 1rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        .unlocked #backBtn { opacity: 1; transform: translateY(0); pointer-events: all; }
        #backBtn:hover { border-color: var(--accent-purple); color: var(--accent-purple); box-shadow: 0 0 15px rgba(139, 92, 246, 0.2); transform: translateX(-5px); }

        /* ── АДАПТИВ ── */
        @media (max-width: 900px) {
            .hero-release { flex-direction: column; text-align: center; padding: 30px 20px; }
            .hero-cover-wrap { width: 100%; max-width: 250px; }
            .hero-badge { align-self: center; }
            .hero-info h2 { font-size: 2.2rem; }

    <script>
        // ==========================================
        // ======= НАСТРОЙКИ СЕРВЕРА ================
        // ==========================================
        const API_URL = "https://dxtrslizze.onrender.com/api";
        const supabaseUrl = 'https://lcbcsyvcciobmqdbonps.supabase.co';
        const supabaseKey = 'sb_publishable_iFmhjG3uVMu76HKSq-jj5g_MOAwpr6h'; 
        let supabaseClient;
        if (window.supabase) supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let isAuthUser = false;
        let currentSessionToken = null;
        let socket = null;

        // === TOAST ===
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            let iconClass = type === 'error' ? 'fa-circle-exclamation' : 'fa-circle-check';
            toast.innerHTML = `<i class="fa-solid ${iconClass}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.style.animation = 'fadeOutRight 0.4s ease forwards'; setTimeout(() => toast.remove(), 400); }, 3500);
        }

        // ========== МЕНЮ И ЧАТ UI ==========
        const burgerBtn = document.getElementById('burgerBtn'), sidebar = document.getElementById('sidebar'), sidebarOverlay = document.getElementById('sidebarOverlay'), closeSidebar = document.getElementById('closeSidebar');
        function toggleSBar() { sidebar.classList.toggle('active'); sidebarOverlay.classList.toggle('active'); }
        if(burgerBtn) burgerBtn.onclick = toggleSBar; if(closeSidebar) closeSidebar.onclick = toggleSBar; if(sidebarOverlay) sidebarOverlay.onclick = toggleSBar;

        const chatWindow = document.getElementById('chat-window'), chatClose = document.getElementById('chat-close'), chatMessages = document.getElementById('chat-messages'), chatInput = document.getElementById('chat-input'), chatSendBtn = document.getElementById('chat-send'), chatHeader = document.getElementById('chat-header'), sidebarSupportBtn = document.getElementById('sidebarSupportBtn');

        function resetChatUI() {
            const inputArea = document.getElementById('chat-input-area');
            if (inputArea) { inputArea.style.opacity = "1"; inputArea.style.display = "flex"; }
            const resolvedBlocks = chatMessages.querySelectorAll('.chat-resolved-status');
            resolvedBlocks.forEach(block => block.remove());
        }

        if(sidebarSupportBtn) {
            sidebarSupportBtn.onclick = (e) => {
                e.preventDefault(); toggleSBar();
                setTimeout(() => {
                    resetChatUI(); chatWindow.style.display = 'flex';
                    if(window.innerWidth > 800) { chatWindow.style.left = 'auto'; chatWindow.style.top = 'auto'; chatWindow.style.right = '30px'; chatWindow.style.bottom = '30px'; }
                    setTimeout(() => { chatMessages.scrollTop = chatMessages.scrollHeight; }, 50);
                }, 300);
            };
        }
        if(chatClose) chatClose.onclick = () => chatWindow.style.display = 'none';

        let isDraggingChat = false, chatOffsetX, chatOffsetY;
        if(chatHeader) {
            chatHeader.addEventListener('mousedown', (e) => {
                if (window.innerWidth <= 800 || e.target.id === 'chat-close') return;
                isDraggingChat = true; chatWindow.style.animation = 'none'; chatWindow.style.transform = 'none';
                const rect = chatWindow.getBoundingClientRect(); chatOffsetX = e.clientX - rect.left; chatOffsetY = e.clientY - rect.top;
                chatWindow.style.right = 'auto'; chatWindow.style.bottom = 'auto'; chatWindow.style.margin = '0';
                chatWindow.style.left = rect.left + 'px'; chatWindow.style.top = rect.top + 'px';
            });
            document.addEventListener('mousemove', (e) => {
                if (!isDraggingChat) return; e.preventDefault();
                let newX = e.clientX - chatOffsetX; let newY = e.clientY - chatOffsetY;
                newX = Math.max(0, Math.min(newX, window.innerWidth - chatWindow.offsetWidth));
                newY = Math.max(0, Math.min(newY, window.innerHeight - chatWindow.offsetHeight));
                chatWindow.style.left = `${newX}px`; chatWindow.style.top = `${newY}px`;
            });
            document.addEventListener('mouseup', () => { isDraggingChat = false; });
        }

        // ========== SUPABASE AUTH И СОКЕТЫ ==========
        const chatGreeting = document.getElementById('chatGreeting');
        const loginModal = document.getElementById('loginModal');
        const profileBtnLink = document.getElementById('profileBtnLink');

        function openLoginModal() { if(loginModal) loginModal.style.display = 'flex'; }
        function closeLoginModal() { if(loginModal) loginModal.style.display = 'none'; }

        function lockChatForGuests() {
            if(chatGreeting) chatGreeting.innerHTML = "Чат тех. поддержки.<br><br><b>Для общения с поддержкой необходимо авторизоваться (иконка профиля).</b>";
            if(chatInput) { chatInput.disabled = true; chatInput.placeholder = "Необходима авторизация"; chatInput.style.borderColor = "var(--glass-border)"; }
            if(chatSendBtn) { chatSendBtn.disabled = true; chatSendBtn.style.background = 'rgba(255,255,255,0.05)'; chatSendBtn.style.color = '#555'; }
        }

        function unlockChatForUser(nickname) {
            window.userNickname = nickname;
            if(chatGreeting) chatGreeting.innerHTML = `Чат тех. поддержки. Приветствую, <b>${nickname}</b>!`; 
            if(chatInput) { chatInput.disabled = false; chatInput.placeholder = "Опишите проблему..."; chatInput.style.borderColor = "var(--glass-border)"; }
            if(chatSendBtn) { chatSendBtn.disabled = false; chatSendBtn.style.background = 'var(--accent-purple)'; chatSendBtn.style.color = '#fff'; }
        }

        async function getUserDataSafe(user) {
            if(!supabaseClient) return null;
            const { data } = await supabaseClient.from('g_users').select('*').eq('id', user.id).single();
            if (data) return data;
            
            const email = user.email;
            const nickname = user.user_metadata.full_name || user.user_metadata.name || email.split('@')[0];
            const avatarUrl = user.user_metadata.avatar_url || '/dslogo.png';
            await supabaseClient.from('g_users').insert({ id: user.id, email: email, nickname: nickname, avatar_url: avatarUrl });
            return { nickname, avatar_url: avatarUrl, dscoin_balance: 100 };
        }

        async function checkSession() {
            if(!supabaseClient) return;
            const { data: { session } } = await supabaseClient.auth.getSession();
            
            if (session) {
                isAuthUser = true;
                currentSessionToken = session.access_token;
                const userData = await getUserDataSafe(session.user);

                const avatarImg = document.getElementById('userAvatar');
                if (avatarImg && userData && userData.avatar_url !== 'dslogo.png') avatarImg.src = userData.avatar_url;

                // Баланс
                if (userData) {
                    const gbw = document.getElementById('globalBalanceWrap');
                    const uiB = document.getElementById('uiBalance');
                    if (gbw && uiB) {
                        gbw.style.display = 'flex'; gbw.classList.add('active');
                        uiB.innerText = userData.dscoin_balance || 0;
                    }
                }

                unlockChatForUser(userData.nickname);

                if (profileBtnLink) {
                    profileBtnLink.onclick = (e) => { e.preventDefault(); window.location.href = 'https://dxtrslizze.xyz/profile'; };
                }

                if (socket && socket.connected) {
                    socket.emit('register_client', { token: currentSessionToken });
                }
            } else {
                isAuthUser = false;
                currentSessionToken = null;
                lockChatForGuests();
                const avatarImg = document.getElementById('userAvatar');
                if (avatarImg) avatarImg.src = '/dslogo.png';
                const gbw = document.getElementById('globalBalanceWrap');
                if (gbw) { gbw.style.display = 'none'; gbw.classList.remove('active'); }
                
                if (profileBtnLink) {
                    profileBtnLink.onclick = (e) => { e.preventDefault(); openLoginModal(); };
                }
            }
        }

        async function handleGoogleCredential(response) {
            closeLoginModal();
            showToast('Синхронизация...', 'info');
            const { error } = await supabaseClient.auth.signInWithIdToken({ provider: 'google', token: response.credential });
            if (error) { showToast('Ошибка авторизации', 'error'); } 
            else { showToast('Успешный вход!', 'success'); }
        }

        function initGoogleAuth() {
            if(window.google) {
                google.accounts.id.initialize({
                    client_id: '538822205607-83ip6fjfah8pjphus91d3ru2tfeb018b.apps.googleusercontent.com',
                    callback: handleGoogleCredential
                });
                const wrapper = document.getElementById("google-btn-wrapper");
                if (wrapper) google.accounts.id.renderButton(wrapper, { type: "standard", theme: "outline", size: "large", width: 300 });
            }
        }

        if(supabaseClient) {
            supabaseClient.auth.onAuthStateChange((event, session) => {
                if (event === 'SIGNED_IN' || event === 'TOKEN_REFRESHED' || event === 'INITIAL_SESSION') { checkSession(); } 
                else if (event === 'SIGNED_OUT') { isAuthUser = false; currentSessionToken = null; lockChatForGuests(); const avatarImg = document.getElementById('userAvatar'); if (avatarImg) avatarImg.src = '/dslogo.png'; }
            });
            window.addEventListener('load', () => checkSession());
        }

        // Инициализация Socket.io
        try {
            socket = io("https://dxtrslizze.onrender.com/");
            
            socket.on('connect', () => { 
                if (isAuthUser && currentSessionToken) { socket.emit('register_client', { token: currentSessionToken }); }
            });

            socket.on('online_update', c => {
                const el = document.getElementById('onlineCount');
                if(el) el.textContent = c;
            });
            
            const chatBanNotice = document.getElementById('chatBanNotice');
            const menuBanLock = document.getElementById('menuBanLock');

            socket.on('ban_status', d => { 
                if (d.isBanned) { 
                    if(menuBanLock) menuBanLock.style.display = 'inline-block';
                    if(chatBanNotice) chatBanNotice.style.display = 'block'; 
                    if(chatGreeting) chatGreeting.style.display = 'none'; 
                    if(chatInput) { chatInput.disabled = true; chatInput.placeholder = "Доступ ограничен."; chatInput.style.borderColor = "var(--error)"; }
                    if(chatSendBtn) { chatSendBtn.disabled = true; chatSendBtn.style.background = 'rgba(255,255,255,0.05)'; chatSendBtn.style.color = '#555'; }
                } else { 
                    if(menuBanLock) menuBanLock.style.display = 'none';
                    if(chatBanNotice) chatBanNotice.style.display = 'none'; 
                    if(chatGreeting && isAuthUser) chatGreeting.style.display = 'block'; 
                    if(chatInput && isAuthUser) { chatInput.disabled = false; chatInput.placeholder = "Опишите проблему..."; chatInput.style.borderColor = "var(--glass-border)"; }
                    if(chatSendBtn && isAuthUser) { chatSendBtn.disabled = false; chatSendBtn.style.background = 'var(--accent-purple)'; chatSendBtn.style.color = '#fff'; }
                } 
            });
            
            socket.on('receive_message', d => { 
                if (chatWindow && (chatWindow.style.display === 'none' || chatWindow.style.display === '')) {
                    resetChatUI();
                    chatWindow.style.display = 'flex'; 
                    if(window.innerWidth > 800) { chatWindow.style.left = 'auto'; chatWindow.style.top = 'auto'; chatWindow.style.right = '30px'; chatWindow.style.bottom = '30px'; }
                }
                addChatMessage('Support', d.text, 'flex-start', true, d.isWarning, d.isSuccess); 
            });

            socket.on('chat_closed_solved', () => { showChatClosedAnimation("Проблема решена", "fa-circle-check"); });
            socket.on('chat_closed_reset', () => { showChatClosedAnimation("Пароль сброшен", "fa-check-double"); });

            if(chatSendBtn) chatSendBtn.onclick = sendMessageToBot; 
            if(chatInput) chatInput.addEventListener("keypress", (e) => { if (e.key === "Enter") { e.preventDefault(); sendMessageToBot(); } });
            
            function sendMessageToBot() { 
                const t = chatInput.value.trim(); 
                if (!t || chatInput.disabled || !isAuthUser) return; 
                socket.emit('send_message', { text: t, token: currentSessionToken }); 
                addChatMessage('Вы', t, 'flex-end', true, false, false); 
                chatInput.value = ''; 
            }
        } catch(err) { console.error("Ошибка при инициализации Socket.io:", err); }

        function addChatMessage(sender, text, align, save = true, isWarn = false, isSucc = false) { 
            const wrapper = document.createElement('div'); wrapper.className = `chat-msg-wrapper ${align === 'flex-end' ? 'msg-user' : 'msg-bot'}`; 
            const nameLab = document.createElement('span'); nameLab.className = 'chat-msg-name'; nameLab.textContent = (sender === 'Вы' && window.userNickname) ? window.userNickname : sender; 
            const bubble = document.createElement('div'); bubble.className = 'chat-msg-bubble'; bubble.textContent = text; 
            if (isWarn) { nameLab.style.color = 'var(--error)'; bubble.style.background = 'rgba(239, 68, 68, 0.1)'; bubble.style.border = '1px solid var(--error)'; } 
            else if (isSucc) { nameLab.style.color = 'var(--success)'; bubble.style.background = 'rgba(16, 185, 129, 0.1)'; bubble.style.border = '1px solid var(--success)'; } 
            wrapper.appendChild(nameLab); wrapper.appendChild(bubble); 
            const msgsContainer = document.getElementById('chat-messages');
            if(msgsContainer) { msgsContainer.appendChild(wrapper); msgsContainer.scrollTop = msgsContainer.scrollHeight; }
            if (save) { 
                const h = JSON.parse(localStorage.getItem('dxtrChatHistory')) || []; 
                h.push({ sender, text, align, isWarning: isWarn, isSuccess: isSucc }); 
                if (h.length > 50) h.shift(); 
                localStorage.setItem('dxtrChatHistory', JSON.stringify(h)); 
            } 
        }
        
        function showChatClosedAnimation(titleHtml, iconClass) {
            const inputArea = document.getElementById('chat-input-area');
            if(inputArea) inputArea.style.opacity = "0";
            setTimeout(() => {
                if(inputArea) inputArea.style.display = "none";
                const statusBlock = document.createElement('div'); statusBlock.className = 'chat-resolved-status';
                statusBlock.innerHTML = `<i class="fa-solid ${iconClass} chat-resolved-icon"></i><div class="chat-resolved-title">${titleHtml}</div>`;
                const msgsContainer = document.getElementById('chat-messages');
                if(msgsContainer) { msgsContainer.appendChild(statusBlock); msgsContainer.scrollTop = msgsContainer.scrollHeight; }
            }, 500); 
        }

        (JSON.parse(localStorage.getItem('dxtrChatHistory')) || []).forEach(m => addChatMessage(m.sender, m.text, m.align, false, m.isWarning, m.isSuccess));

        // ========== ПРОМОКОД (СВЯЗЬ С СЕРВЕРОМ SUPABASE) ==========
        const promoInput = document.getElementById('promoInput');
        const promoSubmit = document.getElementById('promoSubmit');
        const promoError = document.getElementById('promoError');
        const promoBox = document.getElementById('promoBox');
        const promoWrapper = document.getElementById('promoWrapper');
        const splashRing = document.getElementById('splashRing');
        const snippetWrapper = document.getElementById('snippetWrapper');
        const lockBadge = document.getElementById('lockBadge');
        const trackTitle = document.getElementById('trackTitle');

        let currentAudioBlobUrl = null;

        async function checkPromo() {
            const val = promoInput.value.trim();
            if (!val) return;

            promoSubmit.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
            promoError.classList.remove('visible');
            promoError.style.color = 'var(--error)';

            try {
                // Вызываем роут на твоем бэкенде, который работает с Supabase
                const headers = {};
                if (currentSessionToken) headers['Authorization'] = `Bearer ${currentSessionToken}`;

                const res = await fetch(`${API_URL}/check/${encodeURIComponent(val)}`, { headers });
                const data = await res.json();
                
                if (res.ok) {
                    if (data.isCurrency) {
                        promoSubmit.innerHTML = '<i class="fa-solid fa-check"></i>';
                        promoError.style.color = 'var(--success)'; 
                        promoError.textContent = `УСПЕХ! Зачислено: ${data.amount} NC`;
                        
                        if (data.dscoin_balance !== undefined) {
                            const uiB = document.getElementById('uiBalance');
                            if(uiB) uiB.innerText = data.dscoin_balance;
                        }

                        promoError.classList.add('visible');
                        const originalShadow = promoBox.style.boxShadow;
                        promoBox.style.boxShadow = '0 0 50px var(--success)';
                        
                        setTimeout(() => {
                            promoError.classList.remove('visible');
                            promoSubmit.innerHTML = '<i class="fa-solid fa-terminal"></i>';
                            promoBox.style.boxShadow = originalShadow;
                            promoInput.value = '';
                            setTimeout(() => promoError.style.color = 'var(--error)', 300);
                        }, 3000);
                        
                        return;
                    }

                    // Медиа промокод: прямые ссылки из Supabase
                    try {
                        const audioRes = await fetch(data.trackUrl);
                        const audioBlob = await audioRes.blob();
                        if (currentAudioBlobUrl) URL.revokeObjectURL(currentAudioBlobUrl);
                        currentAudioBlobUrl = URL.createObjectURL(audioBlob);
                        const audioObj = document.getElementById('snippetAudio');
                        audioObj.src = currentAudioBlobUrl;
                        audioObj.load();
                    } catch(e) {
                        document.getElementById('snippetAudio').src = data.trackUrl;
                    }

                    document.getElementById('trackTitle').textContent = data.title;
                    document.getElementById('realCover').src = data.coverUrl;
                    
                    promoSubmit.innerHTML = '<i class="fa-solid fa-terminal"></i>';
                    promoBox.classList.add('collapsing');
                    setTimeout(() => {
                        promoBox.style.opacity = '0';
                        splashRing.classList.add('animate');
                        setTimeout(() => {
                            promoWrapper.classList.add('hidden');
                            snippetWrapper.classList.add('unlocked');
                            lockBadge.classList.remove('locked-badge');
                            lockBadge.classList.add('unlocked-badge');
                            lockBadge.innerHTML = '<i class="fa-solid fa-lock-open"></i> Доступ открыт';
                        }, 200);
                    }, 600);

                } else {
                    promoSubmit.innerHTML = '<i class="fa-solid fa-terminal"></i>';
                    promoError.style.color = 'var(--error)';
                    promoError.textContent = data.error || "Данный промокод не существует";
                    triggerErrorAnim();
                }
            } catch (err) {
                promoSubmit.innerHTML = '<i class="fa-solid fa-terminal"></i>';
                promoError.style.color = 'var(--error)';
                promoError.textContent = "Ошибка соединения с сервером";
                triggerErrorAnim();
            }
        }

        function triggerErrorAnim() {
            promoError.classList.add('visible');
            promoBox.style.transition = 'transform 0.1s';
            ['-10px','10px','-10px','0px'].forEach((x, i) => {
                setTimeout(() => promoBox.style.transform = `translateX(${x})`, i * 100);
            });
            setTimeout(() => promoBox.style.transition = '', 400);
        }

        promoSubmit.onclick = checkPromo;
        promoInput.addEventListener('keypress', e => { if (e.key === 'Enter') checkPromo(); });
        promoInput.addEventListener('input', () => promoError.classList.remove('visible'));

        function goBack() {
            if (snippetAudio && !snippetAudio.paused) { snippetAudio.pause(); snippetAudio.currentTime = 0; }
            if (playBtnIcon) playBtnIcon.className = 'fa-solid fa-play';
            if (snippetHero) { snippetHero.style.transform = 'scale(1)'; snippetHero.style.boxShadow = ''; }

            snippetWrapper.classList.remove('unlocked');
            setTimeout(() => {
                lockBadge.classList.remove('unlocked-badge');
                lockBadge.classList.add('locked-badge');
                lockBadge.innerHTML = '<i class="fa-solid fa-lock"></i> Контент скрыт';
                trackTitle.textContent = '???';
            }, 300);
            setTimeout(() => {
                promoWrapper.classList.remove('hidden');
                splashRing.classList.remove('animate');
                setTimeout(() => {
                    promoBox.style.opacity = '1';
                    promoBox.classList.remove('collapsing');
                    promoInput.value = '';
                }, 50);
            }, 600);
        }

        // ========== WEB AUDIO ПУЛЬСАЦИЯ ==========
        const snippetAudio = document.getElementById('snippetAudio');
        const snippetHero = document.getElementById('snippetHero');
        let audioCtx, analyser, source, dataArray, isAudioSetup = false;

        function setupAudio() {
            if (isAudioSetup) return;
            const AC = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AC();
            analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
            source = audioCtx.createMediaElementSource(snippetAudio);
            source.connect(analyser); analyser.connect(audioCtx.destination);
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            isAudioSetup = true;
            pulseBeat();
        }

        function pulseBeat() {
            requestAnimationFrame(pulseBeat);
            if (!snippetAudio || snippetAudio.paused) return;
            analyser.getByteFrequencyData(dataArray);
            let sum = 0; for(let i = 0; i < 10; i++) sum += dataArray[i];
            const avg = sum / 10;
            if (avg < 30) { snippetHero.style.transform = 'scale(1)'; return; }
            const scale = 1 + (avg / 255) * 0.05;
            const glow = 50 + (avg / 255) * 70;
            snippetHero.style.transform = `scale(${scale})`;
            snippetHero.style.boxShadow = `0 0 ${glow}px rgba(139, 92, 246, 0.3), inset 0 0 ${glow/2}px rgba(139, 92, 246, 0.2)`;
        }

        // ========== ПЛЕЕР И ПЕРЕМОТКА ==========
        const playBtnIcon = document.querySelector('#playBtn i');
        const progressBar = document.getElementById('progressBar');
        const progressContainer = document.getElementById('progressContainer');
        const timeDisplay = document.getElementById('timeDisplay');
        let isDragging = false;

        function togglePlay() {
            if (!isAudioSetup) setupAudio();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            if (snippetAudio.paused) {
                snippetAudio.play(); playBtnIcon.className = 'fa-solid fa-pause';
            } else {
                snippetAudio.pause(); playBtnIcon.className = 'fa-solid fa-play';
                if (snippetHero) snippetHero.style.transform = 'scale(1)';
            }
        }

        function fmt(s) {
            if (!s || isNaN(s) || !isFinite(s)) return '00:00';
            return `${Math.floor(s/60)<10?'0':''}${Math.floor(s/60)}:${Math.floor(s%60)<10?'0':''}${Math.floor(s%60)}`;
        }

        snippetAudio.addEventListener('loadedmetadata', () => { 
            if (isFinite(snippetAudio.duration)) {
                timeDisplay.textContent = `00:00 / ${fmt(snippetAudio.duration)}`; 
            }
        });

        function updateProg(x) {
            const r = progressContainer.getBoundingClientRect();
            const pct = Math.max(0, Math.min((x - r.left) / r.width, 1));
            progressBar.style.width = (pct * 100) + '%';
            
            if (snippetAudio.duration && isFinite(snippetAudio.duration)) {
                snippetAudio.currentTime = pct * snippetAudio.duration;
                timeDisplay.textContent = `${fmt(snippetAudio.currentTime)} / ${fmt(snippetAudio.duration)}`;
            }
        }

        progressContainer.addEventListener('mousedown', e => { isDragging = true; updateProg(e.clientX); });
        window.addEventListener('mousemove', e => { if (isDragging) { e.preventDefault(); updateProg(e.clientX); } });
        window.addEventListener('mouseup', () => isDragging = false);
        
        progressContainer.addEventListener('touchstart', e => { isDragging = true; updateProg(e.touches[0].clientX); }, { passive: false });
        progressContainer.addEventListener('touchmove', e => { if (isDragging) { e.preventDefault(); updateProg(e.touches[0].clientX); } }, { passive: false });
        progressContainer.addEventListener('touchend', () => isDragging = false);

        snippetAudio.addEventListener('timeupdate', () => {
            if (snippetAudio.duration && isFinite(snippetAudio.duration) && !isDragging) {
                progressBar.style.width = `${(snippetAudio.currentTime / snippetAudio.duration) * 100}%`;
                timeDisplay.textContent = `${fmt(snippetAudio.currentTime)} / ${fmt(snippetAudio.duration)}`;
            }
        });

        snippetAudio.addEventListener('ended', () => {
            playBtnIcon.className = 'fa-solid fa-play';
            progressBar.style.width = '0%';
            snippetAudio.currentTime = 0;
            if (isFinite(snippetAudio.duration)) {
                timeDisplay.textContent = `00:00 / ${fmt(snippetAudio.duration)}`;
            }
            if (snippetHero) snippetHero.style.transform = 'scale(1)';
        });
    </script>
</body>
</html>
